name: hccl_action

on:
  workflow_dispatch:
  pr_comment:
      types: [ created ]
      keyword: '^(?:\/)?compile*'
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]

env:
  org_name: "opencann"
  repo_name: "hccl"
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  TARGET_BRANCH: ${{atomgit.base_ref}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  obs_path: "test/hccl/package/${{ env.MERGE_ID }}"  

stages:
  stage1:
    name: image
    jobs:
      JOB_image:
        name: image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: "hccl"
              target_branch: ${{ env.TARGET_BRANCH }}
              #repo_url: ${{ vars.CI_PATH }}
              repo_url: https://gitcode.com/cann/.gitcode.git
          -
            name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_X86 }}"
        if: "${{ default() }}"
        runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "large"]
      JOB_pr:  
        name: get_pr_files
        steps:
          - 
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: get_pr
            identifier: get_pr
            uses: cann/.gitcode/actions/get-pr@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              target_branch: ${{ env.TARGET_BRANCH }}
              git_token: ${{secrets.GIT_TOKEN}}
          - 
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/pr_filelist.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_mod.txt
                ${{ steps.process_checkout.outputs.path }}/pr_filelist_precommit.txt
                ${{ steps.process_checkout.outputs.path }}/update_file_detail.txt
              object-prefix: ${{ env.obs_path }}/
        runs-on: 
        - default
      JOB_shell:
        name: get_shell_files
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: master
              token: ${{secrets.GIT_TOKEN}}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/*
              object-prefix: ${{ env.obs_path }}/
        if: "${{ default() }}"
        runs-on:
        - default
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: compile
    jobs:
      JOB_codecheck_action:
        name: codecheck_action
        uses: .gitcode/workflows/codecheck_action.yml
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_x86_compile:
        name: x86_compile
        uses: .gitcode/workflows/x86_compile_action.yml
        with:
          task_name: 'x86_compile'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
      JOB_x86_compile_ubuntu24:
        name: x86_compile_ubuntu24
        uses: .gitcode/workflows/x86_compile_action.yml
        with: 
          task_name: 'x86_compile_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_ubuntu24  }}
      JOB_x86_compile_monitor:
        name: x86_compile_monitor
        uses: .gitcode/workflows/x86_compile_action.yml
        with:
          task_name: 'x86_compile_monitor'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_monitor }}
      JOB_arm_compile:
        name: arm_compile
        uses: .gitcode/workflows/arm_compile_action.yml
        with:
          task_name: 'arm_compile'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_arm_compile_ubuntu24:
        name: arm_compile_ubuntu24
        uses: .gitcode/workflows/arm_compile_action.yml
        with:
          task_name: 'arm_compile_24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_ubuntu24 }}
      JOB_arm_compile_monitor:
        name: arm_compile_monitor
        uses: .gitcode/workflows/arm_compile_action.yml
        with:
          task_name: 'arm_compile_monitor'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_monitor }}
      JOB_staticcheck_markdown:
        name: staticcheck_markdown
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'markdown'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_codespell_check:
        name: staticcheck_codespell_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'codespell_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_tag_closed_check:
        name: staticcheck_tag_closed_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'tag_closed_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_resource_existence_check:
        name: staticcheck_resource_existence_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'resource_existence_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
      JOB_staticcheck_link_validity_check:
        name: staticcheck_link_validity_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'link_validity_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: false
  stage3: 
    name: ut
    select: selected_by_default
    jobs:
      JOB_api_check:
        name: API_Check
        select: selected_by_default
        needs: []
        steps:
          - 
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              token: ${{secrets.GIT_TOKEN}}
          -
            name: api_check
            identifier: api_check
            uses: cann/.gitcode/actions/api-check@master
            with:
              org_name: ${{ env.org_name }}
              task_name: "api-check"
              repo_name: ${{ env.repo_name }}
              source_branch: ${{ env.SOURCE_BRANCH }}
              target_branch: ${{ env.TARGET_BRANCH }}
              merge_id: ${{ env.MERGE_ID }}
              WORKSPACE: ${{ steps.process_checkout.outputs.path }}
        if: "${{ default() }}"
        runs-on: [dedicated-hosted, x64, large]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu24.04_x86:lv1_v1.1032
      JOB_UT_TEST:
        name: UT_TEST
        select: selected_by_default
        needs: []
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'ut'
          ut_package: 'coverage_*.info'
          token: ${{secrets.GIT_TOKEN}}
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      JOB_ST_TEST:
        name: ST_TEST
        select: selected_by_default
        needs: []
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'st'
          ut_package: 'coverage_*.info'
          token: ${{secrets.GIT_TOKEN}}
          image_version: ${{ jobs.JOB_image.outputs.ST_Test }}
    pre:
    - type: auto
    fail-fast: false
  stage4: 
    name: PreSmoke
    select: selected_by_default
    jobs:
      JOB_PreSmoke_A900:
        name: PreSmoke_A900_npupool
        select: selected_by_default
        needs: []
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'ut'
          ut_package: 'coverage_*.info'
          token: ${{secrets.GIT_TOKEN}}
          image_version: ${{ jobs.JOB_image.outputs.PreSmoke_A900_npupool }}
      JOB_PreSmoke_A3_npupool:
        name: PreSmoke_A3_npupool
        select: selected_by_default
        needs: []
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'st'
          ut_package: 'coverage_*.info'
          token: ${{secrets.GIT_TOKEN}}
          image_version: ${{ jobs.JOB_image.outputs.PreSmoke_A3_npupool }}
    pre:
    - type: auto
    fail-fast: false

